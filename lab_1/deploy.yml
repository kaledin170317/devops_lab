---
- hosts: server
  become: true
  vars:
    git_repo: https://github.com/kaledin170317/devops_lab.git

  tasks:
    - name: Установить Docker, Compose и Git
      ansible.builtin.apt:
        name: [docker-ce, docker-compose-plugin, git]
        update_cache: true

    - name: Запустить Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Загрузить проект из Git
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: /opt/devops_lab_git
        version: main

    - name: Собрать и запустить контейнеры
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: /opt/devops_lab_git/lab_1
