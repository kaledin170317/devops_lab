services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: lab1
      POSTGRES_USER: lab1
      POSTGRES_PASSWORD: lab1password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: lab1
      POSTGRES_USER: lab1
      POSTGRES_PASSWORD: lab1password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
